# OWASP ZAP Automation Framework — plano DAST compartilhado pelos grupos A e B.
# A API e suas operações são descobertas pela especificação OpenAPI publicada em /openapi.json.
# O plano não presume rotas funcionais além desse contrato de documentação.
# Documentação: https://www.zaproxy.org/docs/desktop/addons/automation-framework/

env:
  contexts:
    - name: authentication-api
      urls:
        - http://host.docker.internal:3000
      includePaths:
        - 'http://host\.docker\.internal:3000/.*'

jobs:
  - type: openapi
    parameters:
      apiUrl: http://host.docker.internal:3000/openapi.json
      context: authentication-api
      targetUrl: http://host.docker.internal:3000

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan-config
    parameters:
      maxScanDurationInMins: 15
      maxRuleDurationInMins: 5
      maxAlertsPerRule: 20
      threadPerHost: 2

  - type: activeScan
    parameters:
      context: authentication-api
      threadPerHost: 2
      maxAlertsPerRule: 20
    policyDefinition:
      defaultStrength: Medium
      defaultThreshold: Medium

  - type: passiveScan-wait
    parameters:
      maxDuration: 5
