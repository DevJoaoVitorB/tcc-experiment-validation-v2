
# Plano DAST do OWASP ZAP para a API de autenticação.
#
# Este plano realiza a análise dinâmica padrão da API.
# Os testes comportamentais são executados separadamente e seus
# achados serão posteriormente integrados à instância do ZAP.
#
# A geração dos relatórios consolidados ocorre após as duas análises.
#
# Documentação oficial:
# Automation Framework:
# https://www.zaproxy.org/docs/desktop/addons/automation-framework/
#
# OpenAPI:
# https://www.zaproxy.org/docs/desktop/addons/openapi-support/automation/
#
# Active Scan:
# https://www.zaproxy.org/docs/desktop/addons/automation-framework/job-ascan/
#
# Limitação do Active Scan para falhas lógicas de autorização:
# https://www.zaproxy.org/docs/desktop/start/features/ascan/

env:
    contexts:
        - name: authentication-api
          urls:
              - http://127.0.0.1:3000
          includePaths:
              - 'http://127\.0\.0\.1:3000/.*'

    vars:
        baseUrl: http://127.0.0.1:3000

jobs:
    # Confirma que a API está disponível antes da análise.
    - type: requestor
      requests:
          - url: http://127.0.0.1:3000/health
            name: Verificar disponibilidade da API
            method: GET

    # Importa os endpoints documentados na especificação OpenAPI.
    - type: openapi
      parameters:
          apiUrl: http://127.0.0.1:3000/openapi.json
          context: authentication-api
          targetUrl: http://127.0.0.1:3000

    # Configura os limites de execução do Active Scan.
    - type: activeScan-config
      parameters:
          maxScanDurationInMins: 15
          maxRuleDurationInMins: 5
          maxAlertsPerRule: 20
          threadPerHost: 2

    # Executa a análise dinâmica padrão nos endpoints importados.
    - type: activeScan
      parameters:
          context: authentication-api
          url: http://127.0.0.1:3000
          threadPerHost: 2
          maxAlertsPerRule: 20
      policyDefinition:
          defaultStrength: Medium
          defaultThreshold: Medium

    # Aguarda a conclusão da análise passiva.
    - type: passiveScan-wait
      parameters:
          maxDuration: 5
